# Look and feel of the prototype. Streamlit reads this when started from this folder.

[client]
toolbarMode = "minimal"          # hide the "Deploy" button and developer menu for demos
showSidebarNavigation = true

[theme]
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
showSidebarBorder = true
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["2.1rem", "1.45rem", "1.15rem", "1rem", "0.95rem", "0.9rem"]
metricValueFontSize = "1.9rem"
metricValueFontWeight = 650
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
chartSequentialColors = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#2a78d6", "#1c5cab", "#0d366b"]

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f7f7f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#16181d"
borderColor = "#e3e3de"
dataframeHeaderBackgroundColor = "#f1f1ee"
linkColor = "#1c5cab"

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f3f0"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#111214"
secondaryBackgroundColor = "#1b1c20"
textColor = "#f0efec"
borderColor = "#2c2d32"
dataframeHeaderBackgroundColor = "#1f2025"
linkColor = "#86b6ef"

[theme.dark.sidebar]
backgroundColor = "#16171a"
secondaryBackgroundColor = "#1f2025"
